[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triad_physics"
version = "0.1.0"
description = "Standalone Triad-equation PDE solver and visualisations, extracted from TriadLang."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TriadLang authors" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x"]

[tool.setuptools.packages.find]
include = ["triad_physics*"]
